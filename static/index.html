<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Image Reader (OCR)</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="container">
    <h1>Image Reader (OCR)</h1>
    <p>Drop an image or PDF, then run OCR and extraction.</p>

    <div class="uploader" id="drop">
      <input id="file" type="file" accept="image/*,application/pdf" />
      <p>JPG / PNG / PDF.</p>
    </div>

    <div class="controls">
      <label>EasyOCR Lang(s): <input id="lang" value="en" /></label>
      <button id="submitBtn">Run OCR</button>
      <button id="extractBtn">Extract (LLM)</button>
      <button id="extractCloudBtn">Extract (Cloud)</button>
      <!-- form-oriented extractors -->
      <button id="buildSpecBtn">Build Spec JSON</button>
      <button id="buildSpecVisionBtn">Build Spec (Vision)</button>
    </div>

    <h3>OCR Text</h3>
    <pre id="output"></pre>

    <h3>Result</h3>
    <pre id="result"></pre>
  </div>

  <script src="/static/script.js?v=7"></script>
</body>
</html>
