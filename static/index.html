<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Image Reader (OCR)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main>
    <h1>Image Reader (OCR)</h1>

    <div class="uploader" id="dropzone">
      <p><strong>Drop an image</strong> here or
        <label class="link">
          <input id="file" type="file" accept="image/*" hidden />
          choose a file
        </label>
      </p>
      <p class="small">JPG / PNG. Tesseract lang: <code>eng</code>. EasyOCR uses <code>en</code>.</p>
    </div>

    <div class="controls">
      <label>Tesseract lang: <input id="lang" value="eng" /></label>
      <button id="submitBtn" type="button">Run OCR</button>
      <button id="extractBtn" type="button">Extract (LLM)</button>
    </div>

    <div id="status" class="small">status: (idle)</div>
    <pre id="output" class="output" placeholder="OCR / JSON will appear here..."></pre>
  </main>

  <!-- cache-bust to avoid stale JS -->
  <script src="/static/script.js?v=3"></script>
</body>
</html>
