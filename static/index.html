<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Image Reader (OCR)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main>
    <h1>Image Reader (OCR)</h1>
    <div class="uploader" id="dropzone">
      <p><strong>Drop an image</strong> here or
        <label class="link"><input id="file" type="file" accept="image/*" hidden />choose a file</label></p>
      <p class="small">JPG / PNG. Default language: <code>eng</code> (Tesseract) or <code>en</code> (PaddleOCR).</p>
    </div>

    <div class="controls">
      <label>Tesseract lang: <input id="lang" value="eng" /></label>
      <button id="submitBtn">Run OCR</button>
    </div>

    <pre id="output" class="output" placeholder="OCR text will appear here..."></pre>
  </main>

  <script src="/static/script.js"></script>
</body>
</html>
